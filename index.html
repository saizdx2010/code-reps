<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const savedTheme = sessionStorage.getItem('code-reps:ui:device:theme')
        const savedPalette = sessionStorage.getItem('code-reps:ui:device:palette')
        document.documentElement.dataset.palette = ['sage', 'ocean', 'plum'].includes(savedPalette) ? savedPalette : 'sage'
        document.querySelector('link[rel=icon]').href = document.documentElement.dataset.palette === 'sage' ? '/favicon.svg' : '/favicon-' + document.documentElement.dataset.palette + '.svg'
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' }
    </script>
    <!-- First-paint styles must work before external CSS or JavaScript arrives. -->
    <style>
      body:has(.startup-loading) { margin: 0; background: #f0f4ed; }
      .startup-loading { min-height: 100dvh; color: #293e33; background: #f0f4ed; font-family: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif; line-height: 1.5; }
      .startup-loading *, .startup-loading *::before { box-sizing: border-box; }
      .startup-loading .startup-brand { display: flex; align-items: center; gap: 10px; height: 68px; padding: 0 max(28px, calc((100vw - 1280px) / 2)); background: #fff; border-bottom: 1px solid #c4d1c1; font-size: 21px; font-weight: 650; letter-spacing: -.05em; }
      .startup-loading .startup-workbook { max-width: 984px; margin: 0 auto; padding: 64px 28px; }
      .startup-loading h1 { margin: 0 0 20px; font-size: clamp(30px, 4vw, 44px); line-height: 1.15; letter-spacing: -.03em; }
      .startup-loading .loading-status, .startup-loading .startup-note { color: #607465; font-size: 14px; }
      .startup-loading .loading-status::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: #456833; vertical-align: middle; animation: startup-breathe 1.6s ease-in-out infinite alternate; }
      .startup-loading .loading-sheet { padding: 28px; min-width: 0; border: 1px solid #c4d1c1; border-radius: 12px; background: #fff; }
      .startup-loading .startup-sheet { margin: 36px 0 24px; }
      .startup-loading .skeleton-line { display: block; height: 12px; width: 85%; margin-bottom: 16px; border-radius: 8px; background: #e7eee2; }
      .startup-loading .skeleton-title { height: 28px; width: 55%; margin-bottom: 24px; }
      .startup-loading .skeleton-short { width: 48%; }
      .startup-loading .startup-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; }
      .startup-loading .startup-columns .loading-sheet { background: #f0f4ed; margin-bottom: 0; }
      @keyframes startup-breathe { from { opacity: .4; } to { opacity: 1; } }
      @media (max-width: 600px) { .startup-loading .startup-workbook { padding: 40px 18px; } .startup-loading .loading-sheet { padding: 22px 18px; } .startup-loading .startup-columns { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { .startup-loading .loading-status::before { animation: none; } }
      :root[data-theme=dark] body:has(.startup-loading), :root[data-theme=dark] .startup-loading { background: #19251f; color: #edf3e8; color-scheme: dark; }
      :root[data-theme=dark] .startup-loading .startup-brand, :root[data-theme=dark] .startup-loading .loading-sheet { background: #24332b; border-color: #465d4c; }
      :root[data-theme=dark] .startup-loading .startup-columns .loading-sheet { background: #19251f; }
      :root[data-theme=dark] .startup-loading .skeleton-line { background: #304237; }
      :root[data-theme=dark] .startup-loading .loading-status, :root[data-theme=dark] .startup-loading .startup-note { color: #b2c3b0; }
      :root[data-theme=dark] .startup-loading .loading-status::before { background: #bce57b; }

      /* Colour schemes live here so startup and the app share one palette owner. */
      :root[data-palette=ocean] { --bg:#eef4f8; --surface:#ffffff; --surface-2:#e1edf4; --border:#b9ccd8; --border-strong:#6b94ab; --text:#253d4c; --muted:#546e7e; --accent:#226581; --accent-soft:#dfedf5; --action:#254b61; --action-hover:#326982; --action-text:#c3edff; --feature:#d3eaf6; --feature-text:#25475a; --feature-muted:#486579; --feature-border:#8dbbd3; }
      :root[data-palette=plum] { --bg:#f5f0f5; --surface:#ffffff; --surface-2:#eee2ed; --border:#d3bfd1; --border-strong:#a27b9d; --text:#493448; --muted:#795d75; --accent:#81467c; --accent-soft:#f0e0ef; --action:#573951; --action-hover:#754b70; --action-text:#f5d4f0; --feature:#efd6ea; --feature-text:#573951; --feature-muted:#785870; --feature-border:#c494ba; }
      :root[data-palette=ocean][data-theme=dark] { --bg:#17252f; --surface:#213442; --surface-2:#2b4353; --border:#416072; --border-strong:#88aabe; --text:#e9f3fa; --muted:#acc3d2; --accent:#97d9f5; --accent-soft:#2a485b; --action:#97d9f5; --action-hover:#bdeaff; --action-text:#203c4c; --feature:#29485a; --feature-text:#dcf3ff; --feature-muted:#b5d0df; --feature-border:#5285a1; }
      :root[data-palette=plum][data-theme=dark] { --bg:#2a1e29; --surface:#3a2b39; --surface-2:#4b3748; --border:#70526a; --border-strong:#bd94b4; --text:#faedf7; --muted:#d0b6c9; --accent:#edb9e3; --accent-soft:#573d51; --action:#edb9e3; --action-hover:#f9d6f2; --action-text:#493047; --feature:#573d51; --feature-text:#fae4f4; --feature-muted:#dcbdd2; --feature-border:#a47798; }
      :root[data-palette=ocean] .startup-loading, :root[data-palette=plum] .startup-loading { color:var(--text); background:var(--bg); }
      :root[data-palette=ocean] body:has(.startup-loading), :root[data-palette=plum] body:has(.startup-loading) { background:var(--bg); }
      :root:is([data-palette=ocean], [data-palette=plum]) .startup-loading .startup-brand, :root:is([data-palette=ocean], [data-palette=plum]) .startup-loading .loading-sheet { background:var(--surface, #fff); border-color:var(--border, #c4d1c1); }
      :root:is([data-palette=ocean], [data-palette=plum]) .startup-loading .startup-columns .loading-sheet { background:var(--bg, #f0f4ed); }
      :root:is([data-palette=ocean], [data-palette=plum]) .startup-loading .skeleton-line { background:var(--surface-2, #e7eee2); }
      :root:is([data-palette=ocean], [data-palette=plum]) .startup-loading .loading-status, :root:is([data-palette=ocean], [data-palette=plum]) .startup-loading .startup-note { color:var(--muted, #607465); }
      :root:is([data-palette=ocean], [data-palette=plum]) .startup-loading .loading-status::before { background:var(--accent, #456833); }
      .startup-brand .logo-ocean, .startup-brand .logo-plum { display:none; }
      :root[data-palette=ocean] .startup-brand .logo-sage, :root[data-palette=plum] .startup-brand .logo-sage { display:none; }
      :root[data-palette=ocean] .startup-brand .logo-ocean, :root[data-palette=plum] .startup-brand .logo-plum { display:block; }
    </style>
    <link rel="stylesheet" href="/src/index.css" />
    <title>Code Reps</title>
  </head>
  <body>
    <div id="root">
      <div class="startup-loading">
        <header class="startup-brand"><img class="logo-sage" src="/favicon.svg" width="30" height="30" alt="" /><img class="logo-ocean" src="/favicon-ocean.svg" width="30" height="30" alt="" /><img class="logo-plum" src="/favicon-plum.svg" width="30" height="30" alt="" /><span>code reps</span></header>
        <main class="startup-workbook" aria-busy="true">
          <h1>Getting your practice ready.</h1>
          <p role="status" class="loading-status">Loading your local progress…</p>
          <div class="loading-sheet startup-sheet" aria-hidden="true"><span class="skeleton-line skeleton-title"></span><span class="skeleton-line"></span><span class="skeleton-line skeleton-short"></span><div class="startup-columns"><div class="loading-sheet"><span class="skeleton-line"></span><span class="skeleton-line skeleton-short"></span></div><div class="loading-sheet"><span class="skeleton-line"></span><span class="skeleton-line skeleton-short"></span></div></div></div>
          <p class="startup-note">Your drafts, notes, and practice stay on this device.</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
