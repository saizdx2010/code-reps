<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const savedTheme = sessionStorage.getItem('code-reps:ui:device:theme')
        const savedPalette = sessionStorage.getItem('code-reps:ui:device:palette')
        document.documentElement.dataset.palette = ['sage', 'ocean', 'plum'].includes(savedPalette) ? savedPalette : 'sage'
        document.querySelector('link[rel=icon]').href = document.documentElement.dataset.palette === 'sage' ? '/favicon.svg' : '/favicon-' + document.documentElement.dataset.palette + '.svg'
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' }
    </script>
    <!-- First-paint styles must work before external CSS or JavaScript arrives. -->
    <style>
      body:has(.startup-loading) { margin: 0; background: #f0f4ed; }
      .startup-loading { display: grid; place-items: center; min-height: 100dvh; color: #293e33; background: #f0f4ed; --startup-glow: rgb(69 104 51 / .16); }
      .startup-loading .startup-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      /* The logo fades in after a short pause, so a quick load never flashes it, then breathes until the app replaces it. */
      .startup-loading .startup-brand { position: relative; display: grid; place-items: center; width: 72px; height: 72px; animation: startup-arrive 420ms 150ms cubic-bezier(.2, .8, .2, 1) both, startup-breathe 2.4s 570ms ease-in-out infinite alternate; }
      .startup-loading .startup-brand::before { content: ''; position: absolute; inset: -44px; border-radius: 50%; background: radial-gradient(circle, var(--startup-glow) 0%, transparent 68%); animation: startup-glow 2.4s 570ms ease-in-out infinite alternate; }
      .startup-loading .startup-brand img { position: relative; width: 72px; height: 72px; }
      @keyframes startup-arrive { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
      @keyframes startup-breathe { from { transform: scale(1); } to { transform: scale(.94); } }
      @keyframes startup-glow { from { opacity: 1; transform: scale(1); } to { opacity: .35; transform: scale(.86); } }
      @media (prefers-reduced-motion: reduce) { .startup-loading .startup-brand, .startup-loading .startup-brand::before { animation: none; } }
      :root[data-theme=dark] body:has(.startup-loading), :root[data-theme=dark] .startup-loading { background: #19251f; color: #edf3e8; color-scheme: dark; }
      :root[data-theme=dark] .startup-loading { --startup-glow: rgb(188 229 123 / .14); }

      /* Colour schemes live here so startup and the app share one palette owner. */
      :root[data-palette=ocean] { --bg:#eef4f8; --surface:#ffffff; --surface-2:#e1edf4; --border:#b9ccd8; --border-strong:#6b94ab; --text:#253d4c; --muted:#546e7e; --accent:#226581; --accent-soft:#dfedf5; --action:#254b61; --action-hover:#326982; --action-text:#c3edff; --feature:#d3eaf6; --feature-text:#25475a; --feature-muted:#486579; --feature-border:#8dbbd3; }
      :root[data-palette=plum] { --bg:#f5f0f5; --surface:#ffffff; --surface-2:#eee2ed; --border:#d3bfd1; --border-strong:#a27b9d; --text:#493448; --muted:#795d75; --accent:#81467c; --accent-soft:#f0e0ef; --action:#573951; --action-hover:#754b70; --action-text:#f5d4f0; --feature:#efd6ea; --feature-text:#573951; --feature-muted:#785870; --feature-border:#c494ba; }
      :root[data-palette=ocean][data-theme=dark] { --bg:#17252f; --surface:#213442; --surface-2:#2b4353; --border:#416072; --border-strong:#88aabe; --text:#e9f3fa; --muted:#acc3d2; --accent:#97d9f5; --accent-soft:#2a485b; --action:#97d9f5; --action-hover:#bdeaff; --action-text:#203c4c; --feature:#29485a; --feature-text:#dcf3ff; --feature-muted:#b5d0df; --feature-border:#5285a1; }
      :root[data-palette=plum][data-theme=dark] { --bg:#2a1e29; --surface:#3a2b39; --surface-2:#4b3748; --border:#70526a; --border-strong:#bd94b4; --text:#faedf7; --muted:#d0b6c9; --accent:#edb9e3; --accent-soft:#573d51; --action:#edb9e3; --action-hover:#f9d6f2; --action-text:#493047; --feature:#573d51; --feature-text:#fae4f4; --feature-muted:#dcbdd2; --feature-border:#a47798; }
      :root[data-palette=ocean] .startup-loading, :root[data-palette=plum] .startup-loading { color:var(--text); background:var(--bg); --startup-glow:color-mix(in srgb, var(--accent) 16%, transparent); }
      :root[data-palette=ocean] body:has(.startup-loading), :root[data-palette=plum] body:has(.startup-loading) { background:var(--bg); }
      .startup-brand .logo-ocean, .startup-brand .logo-plum { display:none; }
      :root[data-palette=ocean] .startup-brand .logo-sage, :root[data-palette=plum] .startup-brand .logo-sage { display:none; }
      :root[data-palette=ocean] .startup-brand .logo-ocean, :root[data-palette=plum] .startup-brand .logo-plum { display:block; }
    </style>
    <!-- The body font is needed for first paint; preloading it avoids a visible swap from the fallback font. -->
    <link rel="preload" href="/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/index.css" />
    <title>Code Reps</title>
  </head>
  <body>
    <div id="root">
      <main class="startup-loading" aria-busy="true">
        <h1 class="startup-hidden">Getting your practice ready.</h1>
        <div class="startup-brand" aria-hidden="true"><img class="logo-sage" src="/favicon.svg" width="72" height="72" alt="" /><img class="logo-ocean" src="/favicon-ocean.svg" width="72" height="72" alt="" /><img class="logo-plum" src="/favicon-plum.svg" width="72" height="72" alt="" /></div>
        <p role="status" class="startup-hidden">Loading your local progress…</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
