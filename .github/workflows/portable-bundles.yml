name: Portable local web bundles

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn package
      - uses: actions/upload-artifact@v4
        with:
          name: code-reps-${{ matrix.runner }}
          path: release/code-reps-*
